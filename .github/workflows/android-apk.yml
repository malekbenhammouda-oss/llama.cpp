name: Build PrismML Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - prism-android
    paths:
      - 'examples/llama.android/**'
      - '.github/workflows/android-apk.yml'
      - 'ggml/**'
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          sdkmanager --install "platforms;android-36"
          sdkmanager --install "build-tools;36.0.0"
          sdkmanager --install "ndk;29.0.13113456"
          sdkmanager --install "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismML-Android-APK
          path: examples/llama.android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
